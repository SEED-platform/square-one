<app-navigation></app-navigation>

<div class="map-workflow-container mx-auto mt-10 max-w-7xl px-2 sm:px-6 lg:px-8">
  <h1 class="text-4xl font-bold">Map-based Workflow</h1>
  <p class="mt-5 text-lg">This page will guide you through the map-based workflow for creating a Covered Building List (CBL).</p>
  <div class="map-container" id="map"></div>

  <!-- Control buttons -->
  <div class="controls-container">
    <button class="export-btn" (click)="exportGeoJSON()">Export GeoJSON (to console)</button>
    <button class="load-btn" [disabled]="!hasPolygon" (click)="loadMSFootprints()">Load MS Footprints</button>
    <button class="clear-btn" (click)="clearMSFootprints()">Clear Footprints</button>
    <button class="proceed-btn" [disabled]="!hasFootprints" (click)="proceedToCBLTable()">Proceed to CBL Table</button>
  </div>

  <!-- Status message -->
  <div class="status-message" *ngIf="statusMessage" [ngClass]="{ error: isError, success: !isError }">
    {{ statusMessage }}
  </div>
</div>
