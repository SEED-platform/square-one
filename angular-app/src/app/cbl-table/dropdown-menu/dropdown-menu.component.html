<div class="relative ml-5 inline-block text-left">
  <div>
    <button
      class="inline-flex w-full justify-center gap-x-1.5 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-gray-300 ring-inset hover:bg-gray-50"
      id="menu-button"
      (click)="toggleMenu()"
      type="button"
      aria-expanded="true"
      aria-haspopup="true"
    >
      Export
      <svg class="-mr-1 h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
      </svg>
    </button>
  </div>
</div>

<!-- Dropdown menu -->
<div
  class="ring-opacity-5 absolute left-[5%] z-10 mt-2 w-40 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black focus:outline-none"
  *ngIf="isOpen"
  role="menu"
  aria-orientation="vertical"
  aria-labelledby="menu-button"
  tabindex="-1"
>
  <div class="py-1" role="none">
    <a class="block border-b border-gray-200 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" id="menu-item-0" href="" role="menuitem" tabindex="-1">Excel</a>
    <a class="block border-b border-gray-200 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" id="menu-item-1" href="" role="menuitem" tabindex="-1">CSV</a>
    <a class="block border-b border-gray-200 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" id="menu-item-2" href="" role="menuitem" tabindex="-1">JSON</a>
    <a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" id="menu-item-3" href="" role="menuitem" tabindex="-1">GeoJSON</a>
  </div>
</div>
