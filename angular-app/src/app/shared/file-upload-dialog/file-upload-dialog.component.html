<!-- File Upload Dialog Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" *ngIf="isOpen" (click)="closeDialog()" (keydown.escape)="closeDialog()" tabindex="0">
  <!-- Dialog Content -->
  <div class="mx-4 w-full max-w-2xl rounded-lg bg-white shadow-xl" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" tabindex="-1">
    <!-- Dialog Header -->
    <div class="flex items-center justify-between rounded-t-lg border-b bg-gray-50 px-6 py-4">
      <h3 class="text-xl font-semibold text-gray-900">Upload Building Data</h3>
      <button class="rounded-md p-2 text-gray-400 hover:bg-gray-200 hover:text-gray-600" (click)="closeDialog()" type="button">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Dialog Body -->
    <div class="p-6">
      <!-- Error Message -->
      <div class="mb-4 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-700" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- File Upload Area -->
      <div class="relative flex flex-col rounded-lg border-2 border-dashed border-gray-300 p-8 text-center transition-colors" [class.border-blue-400]="isDraggedOver" [class.bg-blue-50]="isDraggedOver" (drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (dragenter)="onDragEnter($event)">
        <!-- Upload Icon -->
        <div class="mx-auto mb-4">
          <svg class="h-12 w-12 text-gray-400" [class.text-blue-500]="isDraggedOver" fill="none" stroke="currentColor" viewBox="0 0 48 48">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"></path>
          </svg>
        </div>

        <!-- Upload Text -->
        <div class="mb-4">
          <p class="text-lg font-medium text-gray-700" [class.text-blue-600]="isDraggedOver">Drop files here to upload</p>
          <p class="text-sm text-gray-500">or</p>
        </div>

        <!-- File Input -->
        <input class="hidden" #fileInput (change)="onFileChange($event)" type="file" accept=".xlsx,.csv,.json,.geojson" />

        <!-- Upload Button -->
        <button class="inline-flex items-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" (click)="onButtonClick()" type="button">
          <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
          Browse Files
        </button>

        <!-- Supported Formats -->
        <p class="mt-2 text-xs text-gray-500">Supported formats: XLSX, CSV, JSON, GeoJSON</p>
      </div>

      <!-- Selected File Display -->
      <div class="mt-6" *ngIf="selectedFile">
        <h4 class="mb-3 text-sm font-medium text-gray-900">Selected File:</h4>
        <div class="flex items-center justify-between rounded-lg border border-gray-200 bg-gray-50 p-4">
          <div class="flex items-center">
            <div class="mr-3 flex h-10 w-10 items-center justify-center rounded-lg bg-blue-100">
              <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5l7-7 7 7M9 20h6m-7 4h7m0 0v8a2 2 0 002 2h8a2 2 0 002-2v-8m0 0V9a2 2 0 00-2-2H8a2 2 0 00-2 2v3m0 0a2 2 0 002-2V6a2 2 0 012-2h6a2 2 0 012 2v2a2 2 0 01-2 2H8a2 2 0 01-2-2z"></path>
              </svg>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-900">{{ selectedFile.name }}</p>
              <p class="text-xs text-gray-500">{{ selectedFile.size }}</p>
            </div>
          </div>
          <button class="rounded-md p-1 text-gray-400 hover:bg-gray-200 hover:text-red-600" (click)="onDelete()" type="button">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Dialog Footer -->
    <div class="flex justify-end space-x-3 rounded-b-lg border-t bg-gray-50 px-6 py-4">
      <button class="rounded-md bg-gray-200 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2" [disabled]="isLoading" (click)="closeDialog()" type="button">Cancel</button>
      <button class="inline-flex items-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" [disabled]="!selectedFile || isLoading" (click)="uploadFile()" type="button">
        <svg class="mr-2 h-4 w-4 animate-spin" *ngIf="isLoading" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        {{ isLoading ? 'Uploading...' : 'Upload & Import' }}
      </button>
    </div>
  </div>
</div>
