version: 2
updates:
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    allow:
      - dependency-type: 'direct'
    groups:
      dev-deps:
        dependency-type: 'development'
      prod-deps:
        dependency-type: 'production'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
  - package-ecosystem: 'npm'
    directory: '/angular-app'
    schedule:
      interval: 'weekly'
    allow:
      - dependency-type: 'direct'
    groups:
      npm-dev-deps:
        dependency-type: 'development'
      npm-prod-deps:
        dependency-type: 'production'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    ignore:
      - dependency-name: 'prettier'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prettier'
        versions: ['alpha', 'beta', 'rc']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        versions: ['>=5.9.0']
      # zone.js (latest 0.16.3) cannot patch jasmine-core 7: "Cannot assign to read only property 'describe'"
      - dependency-name: 'jasmine-core'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions-deps:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - 'Do not publish'
