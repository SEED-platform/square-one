name: CI

on:
  push:

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out cbl-workflow repository
        uses: actions/checkout@v4
        with:
          repository: SEED-platform/cbl-workflow
          path: cbl-workflow
      - name: Move cbl-workflow to expected location
        run: |
          mkdir -p ../
          mv cbl-workflow ../cbl-workflow  # Move to one level up
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1.4.1
      - name: Install Python dependencies
        working-directory: flask_app
        run: |
          python -m pip install --upgrade pip
          poetry install
      - name: Run pre-commit
        run: |
          poetry run pre-commit run --all-files || {
            echo "Pre-commit failed. Here are the changes:"
            git diff
            exit 1
          }
      - name: Run Python Tests
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPQUEST_API_KEY: ${{ secrets.MAPQUEST_API_KEY }}
        run: poetry run pytest

  angular-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install node dependencies and Google Chrome
        working-directory: angular-app
        run: |
          npm install
          # Need chrome for Angular tests
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          # copy over the environment.ts, otherwise tests will fail.
          cp src/environments/environment.ts.template src/environments/environment.ts
      - name: Build Angular Application
        working-directory: angular-app
        run: |
          # Verify the app builds successfully before running tests
          npm run build
      - name: Run Angular Tests
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPQUEST_API_KEY: ${{ secrets.MAPQUEST_API_KEY }}
        working-directory: angular-app
        run: |
          # install angular cli
          npm install -g @angular/cli@17
          # This executes all *.spec.ts files in the project
          ng test --watch=false --browsers=ChromeHeadless --code-coverage --progress
      - name: Upload Angular Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: angular-coverage
          path: angular-app/coverage/
          retention-days: 7
